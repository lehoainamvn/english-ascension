spring.config.import=optional:file:.env,optional:file:../.env,optional:file:../../.env

spring.application.name=backend
server.port=${PORT:8080}

# Database Configuration (Local with Environment Overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/english_ascension}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_postgres_password}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# JWT Configuration (Safe Fallback)
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration=86400000

# Groq API Configuration
groq.api.key=${GROQ_API_KEY:gsk_placeholder_please_change_me}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1}
groq.api.model=${GROQ_API_MODEL:llama-3.3-70b-versatile}

# Multipart File Upload Configuration (Allow up to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# SMTP Mail Server Configuration (Gmail app credentials)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google Client ID
google.client.id=${GOOGLE_CLIENT_ID:685073393507-kd768suv87jepg4b37bmlaf4j7lf7bav.apps.googleusercontent.com}

