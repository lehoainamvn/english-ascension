@if (showNavbar()) {
  <app-navbar></app-navbar>
  <app-ai-chat-bubble></app-ai-chat-bubble>
}
<router-outlet></router-outlet>

<!-- Global Toast Notification System -->
<div class="fixed top-24 right-6 z-[9999] flex flex-col gap-3 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      [ngClass]="{
        'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400': toast.type === 'success',
        'bg-rose-500/10 text-rose-600 dark:text-rose-400': toast.type === 'error',
        'bg-amber-500/10 text-amber-600 dark:text-amber-400': toast.type === 'warning',
        'bg-blue-500/10 text-blue-600 dark:text-blue-400': toast.type === 'info'
      }"
      class="pointer-events-auto backdrop-blur-md px-4 py-3 rounded-xl shadow-xl flex items-center justify-between gap-3 text-xs font-bold transition-all duration-300 transform translate-x-0 animate-slide-in-right"
    >
      <div class="flex items-center">
        <span class="leading-relaxed font-semibold">{{ toast.message }}</span>
      </div>
      <button (click)="toastService.remove(toast.id)" class="text-current opacity-70 hover:opacity-100 p-1 cursor-pointer rounded-lg hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
      </button>
    </div>
  }
</div>
