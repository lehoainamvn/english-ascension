@if (showNavbar()) {
  <app-navbar></app-navbar>
  <app-ai-chat-bubble></app-ai-chat-bubble>
}
<router-outlet></router-outlet>

<!-- Global Toast Notification System -->
<div class="fixed top-24 right-6 z-[9999] flex flex-col gap-3 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      [ngClass]="{
        'border-l-emerald-500': toast.type === 'success',
        'border-l-rose-500': toast.type === 'error',
        'border-l-amber-500': toast.type === 'warning',
        'border-l-blue-500': toast.type === 'info'
      }"
      class="pointer-events-auto bg-bg-card/95 backdrop-blur-md border border-border-main border-l-4 px-4 py-3 rounded-xl shadow-xl flex items-center justify-between gap-3 text-xs font-bold transition-all duration-300 transform translate-x-0 animate-slide-in-right text-text-main"
    >
      <div class="flex items-center gap-2">
        @if (toast.type === 'success') {
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-emerald-500 shrink-0"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 15.01 9 12.01"/></svg>
        } @else if (toast.type === 'error') {
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-rose-500 shrink-0"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        } @else if (toast.type === 'warning') {
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-amber-500 shrink-0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-blue-500 shrink-0"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        }
        <span class="leading-relaxed font-semibold">{{ toast.message }}</span>
      </div>
      <button (click)="toastService.remove(toast.id)" class="text-text-muted hover:text-text-main p-1 cursor-pointer rounded-lg hover:bg-bg-input/60 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
      </button>
    </div>
  }
</div>
